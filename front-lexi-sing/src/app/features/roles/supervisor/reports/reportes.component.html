<div class="reports-page">
  <div class="header">
    <h2>Reportes</h2>
    <button mat-raised-button color="primary" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      Volver
    </button>
  </div>

  <div class="stats-cards">
    <mat-card>
      <mat-card-title>Usuarios</mat-card-title>
      <mat-card-content>{{ totalUsuarios }}</mat-card-content>
    </mat-card>
    <mat-card>
      <mat-card-title>Conversaciones</mat-card-title>
      <mat-card-content>{{ totalConversaciones }}</mat-card-content>
    </mat-card>
    <mat-card>
      <mat-card-title>Mensajes</mat-card-title>
      <mat-card-content>{{ totalMensajes }}</mat-card-content>
    </mat-card>
    <mat-card>
      <mat-card-title>Activos</mat-card-title>
      <mat-card-content>{{ usuariosActivos }}</mat-card-content>
    </mat-card>
  </div>

  <mat-tab-group (selectedIndexChange)="onTabChange($event)">
    <mat-tab label="Usuarios">
      <div id="grafico-usuarios" class="chart"></div>
    </mat-tab>
    <mat-tab label="Conversaciones">
      <div id="grafico-conversaciones" class="chart"></div>
    </mat-tab>
    <mat-tab label="Actividad 3D">
      <div id="grafico-3d" class="chart"></div>
    </mat-tab>
    <mat-tab label="Mensajes">
      <div id="grafico-mensajes" class="chart"></div>
    </mat-tab>
  </mat-tab-group>
</div>
