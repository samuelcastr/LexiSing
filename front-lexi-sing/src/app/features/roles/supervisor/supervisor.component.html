<div class="role-page supervisor-page">
  <section class="hero-card">
    <div class="hero-text">
      <p class="subtitle">Rol Supervisor</p>
      <h1>Bienvenido, {{ userName }}</h1>
      <p>Accede al panel de monitoreo, conversaciones y reportes para supervisar la operación.</p>
    </div>

    <div class="button-group">
      <button mat-raised-button color="primary" (click)="goToDashboard()">
        <mat-icon>dashboard</mat-icon>
        Panel
      </button>
      <button mat-stroked-button color="accent" (click)="goToConversations()">
        <mat-icon>message</mat-icon>
        Chat
      </button>
    </div>
  </section>

  <section class="quick-links">
    <h2>Accesos rápidos</h2>
    <div class="links-grid">
      <button mat-flat-button class="link-card" (click)="goToMonitoring()">
        <mat-icon>chat</mat-icon>
        Monitoreo de conversaciones
      </button>
      <button mat-flat-button class="link-card" (click)="goToReports()">
        <mat-icon>description</mat-icon>
        Reportes
      </button>
    </div>
  </section>
</div>
