<mat-card class="content-card">
  <div class="table-container">
    <table mat-table [dataSource]="users" class="user-table">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let user">
          <div class="user-info">
            <div class="user-avatar">{{user.nombre?.charAt(0) || 'U'}}</div>
            <span>{{user.nombre}}</span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Correo</th>
        <td mat-cell *matCellDef="let user">{{user.email}}</td>
      </ng-container>

      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef>{{ showPendingBadge ? 'Estado' : 'Rol' }}</th>
        <td mat-cell *matCellDef="let user">
          <span class="badge pending" *ngIf="showPendingBadge && user.rol === 'usuario'">Pendiente</span>
          <span class="badge role" *ngIf="!showPendingBadge">{{user.rol}}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="nuevoRol">
        <th mat-header-cell *matHeaderCellDef>{{ showPendingBadge ? 'Asignar rol' : 'Cambiar Rol' }}</th>
        <td mat-cell *matCellDef="let user">
          <mat-select [value]="selectedRoles[user.uid]" (selectionChange)="onRoleChange(user.uid, $event.value)">
            <mat-option *ngFor="let role of availableRoles" [value]="role">{{role}}</mat-option>
          </mat-select>
        </td>
      </ng-container>

      <ng-container matColumnDef="accion">
        <th mat-header-cell *matHeaderCellDef>{{ showPendingBadge ? 'Acción' : 'Guardar' }}</th>
        <td mat-cell *matCellDef="let user">
          <button mat-flat-button color="primary"
            *ngIf="shouldShowAction(user)"
            [disabled]="!hasChanged(user.uid, user.rol || 'usuario')"
            (click)="cambiarRol(user.uid, user.rol || 'usuario')">
            {{actionButtonLabel}}
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</mat-card>
