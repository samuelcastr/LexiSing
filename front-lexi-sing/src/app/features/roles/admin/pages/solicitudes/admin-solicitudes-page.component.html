<div class="section-header">
  <div>
    <h2>Solicitudes pendientes</h2>
    <p>Usuarios registrados que aún no tienen un rol asignado.</p>
  </div>
</div>

<div class="search-bar">
  <mat-icon>search</mat-icon>
  <input
    type="text"
    placeholder="Buscar solicitud por nombre o correo..."
    [(ngModel)]="searchTerm"
    (input)="filterSolicitudes()"
  />
</div>

<div class="no-results" *ngIf="pendingUsers.length > 0 && filteredPending.length === 0">
  No se encontraron solicitudes que coincidan con la búsqueda.
</div>

<app-user-table
  [users]="filteredPending"
  [showPendingBadge]="true"
  [showActionForRole]="'usuario'"
  actionButtonLabel="Aprobar"
  (roleChanged)="handleRoleChange($event)">
</app-user-table>
